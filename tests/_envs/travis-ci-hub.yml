modules:
  enabled:
    - \SuiteCRM\Test\Driver\WebDriver
  config:
    \SuiteCRM\Test\Driver\WebDriver:
      url: "http://localhost:8080/"
      wait: 0
      port: 9515
      browser: chrome
      window_size: false
      clear_cookies: true
      capabilities:
        chromeOptions:
            args: ["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu", "--window-size=1920x1080"]
            binary: "/usr/bin/google-chrome-stable"
